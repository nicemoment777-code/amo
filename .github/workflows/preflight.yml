name: Production preflight

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Tests
        run: node --test

      - name: Check existing required secrets
        shell: bash
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
          VPS_DOMAIN: ${{ secrets.VPS_DOMAIN }}
          CDEK_CLIENT_ID: ${{ secrets.AMO_ACCOUNT_ID }}
          CDEK_CLIENT_SECRET: ${{ secrets.AMO_PASSWORD }}
          CDEK_ORDER_NUMBERS: ${{ secrets.CDEK_ORDER_NUMBERS }}
        run: |
          set -Eeuo pipefail
          for name in VPS_SSH_HOST VPS_SSH_USER VPS_SSH_PASSWORD VPS_DOMAIN CDEK_CLIENT_ID CDEK_CLIENT_SECRET CDEK_ORDER_NUMBERS; do
            [[ -n "${!name:-}" ]] || { echo "Missing secret: $name"; exit 1; }
          done
          echo "Existing deployment/CDEK secrets are present."

      - name: Verify SSH password login
        shell: bash
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          umask 077
          ssh-keyscan -T 10 -t ed25519,rsa "$VPS_SSH_HOST" > known_hosts
          test -s known_hosts
          export SSHPASS="$VPS_SSH_PASSWORD"
          sshpass -e ssh -o UserKnownHostsFile="$PWD/known_hosts" -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$VPS_SSH_USER@$VPS_SSH_HOST" 'echo SSH_LOGIN_OK; id -u; . /etc/os-release; echo "$PRETTY_NAME"; ss -lnt | sed -n "1,20p"'

      - name: Verify CDEK and known waybills
        shell: bash
        env:
          CDEK_CLIENT_ID: ${{ secrets.AMO_ACCOUNT_ID }}
          CDEK_CLIENT_SECRET: ${{ secrets.AMO_PASSWORD }}
          CDEK_ORDER_NUMBERS: ${{ secrets.CDEK_ORDER_NUMBERS }}
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import {CdekClient, parseNumbers} from './cdek.mjs';
          const client = new CdekClient(process.env.CDEK_CLIENT_ID, process.env.CDEK_CLIENT_SECRET);
          const numbers = parseNumbers(process.env.CDEK_ORDER_NUMBERS || '');
          await client.token();
          let ok = 0;
          const failed = [];
          for (const number of numbers) {
            try { await client.order(number); ok++; }
            catch (e) { failed.push({number, message:e.message}); }
          }
          console.log(`CDEK_AUTH_OK known_orders=${ok}/${numbers.length}`);
          if (failed.length) {
            for (const x of failed) console.error(`${x.number}: ${x.message}`);
            process.exit(1);
          }
          NODE
