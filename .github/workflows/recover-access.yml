name: Recover dashboard access

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/recover-access.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALT_DOMAIN: 185-77-219-91.sslip.io
    steps:
      - name: External network probe
        shell: bash
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_DOMAIN: ${{ secrets.VPS_DOMAIN }}
        run: |
          set -u
          echo '== DNS primary =='
          getent ahostsv4 "$VPS_DOMAIN" || true
          echo '== DNS alternate =='
          getent ahostsv4 "$ALT_DOMAIN" || true
          echo '== External TCP ports =='
          for port in 22 80 443 3080; do
            if timeout 7 bash -c "</dev/tcp/$VPS_SSH_HOST/$port" 2>/dev/null; then
              echo "TCP $port: OPEN"
            else
              echo "TCP $port: CLOSED/NO RESPONSE"
            fi
          done
          echo 'Port 3080 is expected to be closed externally.'

      - name: Validate alternate DNS
        shell: bash
        run: |
          set -Eeuo pipefail
          getent ahostsv4 "$ALT_DOMAIN"
          ip=$(getent ahostsv4 "$ALT_DOMAIN" | awk 'NR==1{print $1}')
          [[ "$ip" == "185.77.219.91" ]] || { echo "Unexpected alternate DNS IP: $ip"; exit 1; }

      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Inspect and repair server access
        shell: bash
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
          VPS_DOMAIN: ${{ secrets.VPS_DOMAIN }}
        run: |
          set -Eeuo pipefail
          umask 077
          ssh-keyscan -T 10 -t ed25519,rsa "$VPS_SSH_HOST" > known_hosts
          test -s known_hosts
          export SSHPASS="$VPS_SSH_PASSWORD"
          sshpass -e ssh -o UserKnownHostsFile="$PWD/known_hosts" -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$VPS_SSH_USER@$VPS_SSH_HOST" "VPS_DOMAIN='$VPS_DOMAIN' ALT_DOMAIN='$ALT_DOMAIN' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          echo '== OS =='
          . /etc/os-release && echo "$PRETTY_NAME"
          echo '== Listening ports BEFORE =='
          ss -lntp | grep -E '(:22|:80|:443|:3080)\b' || true
          echo '== Services BEFORE =='
          systemctl is-active ssh.service || true
          systemctl is-active nginx.service || true
          systemctl is-active amo.service || true
          echo '== UFW BEFORE =='
          if command -v ufw >/dev/null 2>&1; then
            ufw status verbose || true
            if ufw status | grep -q '^Status: active'; then
              ufw allow 22/tcp >/dev/null
              ufw allow 80/tcp >/dev/null
              ufw allow 443/tcp >/dev/null
            fi
          fi
          systemctl restart amo.service
          systemctl restart nginx.service
          python3 - <<'PY'
          import os, re
          p='/etc/nginx/sites-available/amo'
          text=open(p, encoding='utf-8').read()
          names=f"server_name {os.environ['VPS_DOMAIN']} {os.environ['ALT_DOMAIN']};"
          text=re.sub(r'server_name\s+[^;]+;', names, text)
          open(p,'w',encoding='utf-8').write(text)
          PY
          nginx -t
          systemctl reload nginx
          echo '== Local app =='
          curl -fsS --max-time 5 http://127.0.0.1:3080/api/state >/dev/null && echo 'APP_LOCAL_OK'
          echo '== Listening ports AFTER =='
          ss -lntp | grep -E '(:22|:80|:443|:3080)\b' || true
          echo '== UFW AFTER =='
          command -v ufw >/dev/null 2>&1 && ufw status verbose || true
          echo '== nftables relevant rules =='
          nft list ruleset 2>/dev/null | grep -E 'hook input|policy|tcp dport (22|80|443|3080)|drop|reject' | head -n 120 || true
          echo '== Local HTTPS through nginx =='
          curl -kIsS --max-time 10 --resolve "$VPS_DOMAIN:443:127.0.0.1" "https://$VPS_DOMAIN/" | sed -n '1,10p' || true
          REMOTE

      - name: Verify public access
        shell: bash
        env:
          VPS_DOMAIN: ${{ secrets.VPS_DOMAIN }}
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
        run: |
          set -Eeuo pipefail
          for host in "$VPS_DOMAIN" "$ALT_DOMAIN"; do
            echo "== https://$host/ =="
            code=$(curl -ksS -o /dev/null -w '%{http_code}' --max-time 15 "https://$host/")
            echo "$host -> HTTP $code"
            [[ "$code" == 401 ]] || exit 1
          done
          echo '== Force primary hostname directly to VPS IP =='
          code=$(curl -ksS -o /dev/null -w '%{http_code}' --max-time 15 --resolve "$VPS_DOMAIN:443:$VPS_SSH_HOST" "https://$VPS_DOMAIN/")
          echo "forced primary -> HTTP $code"
          [[ "$code" == 401 ]]
