name: VPS connectivity probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vps-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
      VPS_DOMAIN: ${{ secrets.REG_VPS_DOMAIN }}
    steps:
      - name: Validate target
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "$VPS_SSH_HOST" ]] || { echo 'Missing VPS_SSH_HOST'; exit 1; }

      - name: Probe TCP ports
        shell: bash
        run: |
          set -u
          for port in 22 80 443; do
            if timeout 8 bash -c "</dev/tcp/$VPS_SSH_HOST/$port" 2>/dev/null; then
              echo "TCP $port: open"
            else
              echo "TCP $port: no response"
            fi
          done

      - name: Read SSH public host key only
        shell: bash
        run: |
          set -Eeuo pipefail
          keyfile=$(mktemp)
          trap 'rm -f "$keyfile"' EXIT
          ssh-keyscan -T 7 -t ed25519 "$VPS_SSH_HOST" > "$keyfile" 2>/dev/null
          test -s "$keyfile"
          echo 'Observed key fingerprint (diagnostic only; does not change trusted keys):'
          ssh-keygen -lf "$keyfile"

      - name: Probe configured domain
        if: env.VPS_DOMAIN != ''
        shell: bash
        run: |
          set -Eeuo pipefail
          getent ahostsv4 "$VPS_DOMAIN"
          curl -IsS --max-time 10 "https://$VPS_DOMAIN/" | sed -n '1,8p'
