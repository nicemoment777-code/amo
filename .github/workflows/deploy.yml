name: Deploy production

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run tests
        run: node --test

      - name: Validate required secrets
        shell: bash
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
          VPS_DOMAIN: ${{ secrets.REG_VPS_DOMAIN }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          CDEK_CLIENT_ID: ${{ secrets.AMO_ACCOUNT_ID }}
          CDEK_CLIENT_SECRET: ${{ secrets.AMO_PASSWORD }}
          CDEK_ORDER_NUMBERS: ${{ secrets.CDEK_ORDER_NUMBERS }}
        run: |
          set -Eeuo pipefail
          for name in VPS_SSH_HOST VPS_SSH_USER VPS_SSH_PASSWORD VPS_DOMAIN VPS_SSH_KNOWN_HOSTS CDEK_CLIENT_ID CDEK_CLIENT_SECRET CDEK_ORDER_NUMBERS; do
            [[ -n "${!name:-}" ]] || { echo "Missing secret: $name"; exit 1; }
          done
          [[ "$VPS_DOMAIN" =~ ^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$ ]] || { echo 'Invalid domain'; exit 1; }
          addresses=$(getent ahostsv4 "$VPS_DOMAIN" | awk '{print $1}' | sort -u)
          [[ "$addresses" == "$VPS_SSH_HOST" ]] || { echo 'Domain must resolve only to the selected VPS IPv4 address'; exit 1; }

      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Verify server identity and SSH login
        shell: bash
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          umask 077
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > known_hosts
          test -s known_hosts
          echo "Server host key fingerprint(s):"
          ssh-keygen -lf known_hosts
          export SSHPASS="$VPS_SSH_PASSWORD"
          sshpass -e ssh -o UserKnownHostsFile="$PWD/known_hosts" -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$VPS_SSH_USER@$VPS_SSH_HOST" 'printf "SSH_LOGIN_OK\n"; . /etc/os-release; echo "$PRETTY_NAME"'

      - name: Verify CDEK credentials and known orders
        shell: bash
        env:
          CDEK_CLIENT_ID: ${{ secrets.AMO_ACCOUNT_ID }}
          CDEK_CLIENT_SECRET: ${{ secrets.AMO_PASSWORD }}
          CDEK_ORDER_NUMBERS: ${{ secrets.CDEK_ORDER_NUMBERS }}
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import {CdekClient, parseNumbers} from './cdek.mjs';
          const client = new CdekClient(process.env.CDEK_CLIENT_ID, process.env.CDEK_CLIENT_SECRET);
          const numbers = parseNumbers(process.env.CDEK_ORDER_NUMBERS || '');
          await client.token();
          let ok = 0;
          for (const number of numbers) await client.order(number).then(()=>ok++);
          console.log(`CDEK credentials OK. Known orders available: ${ok}/${numbers.length}`);
          NODE

      - name: Prepare release bundle
        shell: bash
        env:
          CDEK_CLIENT_ID: ${{ secrets.AMO_ACCOUNT_ID }}
          CDEK_CLIENT_SECRET: ${{ secrets.AMO_PASSWORD }}
          VPS_DOMAIN: ${{ secrets.REG_VPS_DOMAIN }}
          CDEK_ORDER_NUMBERS: ${{ secrets.CDEK_ORDER_NUMBERS }}
        run: |
          set -Eeuo pipefail
          tar --exclude=.git --exclude=data --exclude=.env -czf /tmp/amo-release.tgz .
          umask 077
          cat > amo.env.new <<EOF
          CDEK_CLIENT_ID="$CDEK_CLIENT_ID"
          CDEK_CLIENT_SECRET="$CDEK_CLIENT_SECRET"
          PORT=3080
          SYNC_INTERVAL_MINUTES=15
          VPS_DOMAIN_FOR_WEBHOOK="$VPS_DOMAIN"
          EOF
          printf '%s' "$CDEK_ORDER_NUMBERS" > amo-order-numbers

      - name: Upload release and server config
        shell: bash
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          export SSHPASS="$VPS_SSH_PASSWORD"
          opts=(-o UserKnownHostsFile="$PWD/known_hosts" -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          sshpass -e scp "${opts[@]}" /tmp/amo-release.tgz amo.env.new amo-order-numbers ops/provision-server.sh "$VPS_SSH_USER@$VPS_SSH_HOST:/root/"

      - name: Provision and deploy
        shell: bash
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
          VPS_DOMAIN: ${{ secrets.REG_VPS_DOMAIN }}
        run: |
          set -Eeuo pipefail
          export SSHPASS="$VPS_SSH_PASSWORD"
          sshpass -e ssh -o UserKnownHostsFile="$PWD/known_hosts" -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$VPS_SSH_USER@$VPS_SSH_HOST" \
            "chmod 700 /root/provision-server.sh && /root/provision-server.sh '${GITHUB_SHA}' '$VPS_DOMAIN'"

      - name: Final external check
        shell: bash
        env:
          VPS_DOMAIN: ${{ secrets.REG_VPS_DOMAIN }}
        run: |
          set -Eeuo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "https://$VPS_DOMAIN/")
          [[ "$code" == 302 ]] || { echo "Expected login redirect (302), got $code"; exit 1; }
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "https://$VPS_DOMAIN/login")
          [[ "$code" == 200 ]] || { echo "Expected login page (200), got $code"; exit 1; }
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "https://$VPS_DOMAIN/api/state")
          [[ "$code" == 401 ]] || { echo "Expected protected API (401), got $code"; exit 1; }
          echo "Production HTTPS endpoint is up and protected."
