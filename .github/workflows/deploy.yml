name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run tests
        run: node --test

      - name: Validate required secrets
        shell: bash
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
          VPS_DOMAIN: ${{ secrets.VPS_DOMAIN }}
          CDEK_CLIENT_ID: ${{ secrets.AMO_ACCOUNT_ID }}
          CDEK_CLIENT_SECRET: ${{ secrets.AMO_PASSWORD }}
          CDEK_ORDER_NUMBERS: ${{ secrets.CDEK_ORDER_NUMBERS }}
          DASHBOARD_USER: ${{ secrets.DASHBOARD_USER }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          set -Eeuo pipefail
          missing=0
          for name in VPS_SSH_HOST VPS_SSH_USER VPS_SSH_PASSWORD VPS_DOMAIN CDEK_CLIENT_ID CDEK_CLIENT_SECRET CDEK_ORDER_NUMBERS DASHBOARD_USER DASHBOARD_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then echo "Missing secret: $name"; missing=1; fi
          done
          exit "$missing"

      - name: Install SSH helper
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Verify server identity and SSH login
        shell: bash
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          umask 077
          ssh-keyscan -T 10 -t ed25519,rsa "$VPS_SSH_HOST" > known_hosts
          test -s known_hosts
          echo "Server host key fingerprint(s):"
          ssh-keygen -lf known_hosts
          SSHPASS="$VPS_SSH_PASSWORD" sshpass -e ssh \
            -o UserKnownHostsFile="$PWD/known_hosts" \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$VPS_SSH_USER@$VPS_SSH_HOST" 'printf "SSH_LOGIN_OK\n"; uname -a; cat /etc/os-release | sed -n "1,4p"'

      - name: Verify CDEK credentials and known orders
        shell: bash
        env:
          CDEK_CLIENT_ID: ${{ secrets.AMO_ACCOUNT_ID }}
          CDEK_CLIENT_SECRET: ${{ secrets.AMO_PASSWORD }}
          CDEK_ORDER_NUMBERS: ${{ secrets.CDEK_ORDER_NUMBERS }}
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import {CdekClient, parseNumbers} from './cdek.mjs';
          const client = new CdekClient(process.env.CDEK_CLIENT_ID, process.env.CDEK_CLIENT_SECRET);
          const numbers = parseNumbers(process.env.CDEK_ORDER_NUMBERS || '');
          await client.token();
          let ok = 0;
          const failures = [];
          for (const number of numbers) {
            try { await client.order(number); ok++; }
            catch (e) { failures.push(`${number}: ${e.message}`); }
          }
          console.log(`CDEK credentials OK. Known orders available: ${ok}/${numbers.length}`);
          if (failures.length) {
            console.error(failures.join('\n'));
            process.exitCode = 1;
          }
          NODE

      - name: Prepare release bundle
        shell: bash
        env:
          CDEK_CLIENT_ID: ${{ secrets.AMO_ACCOUNT_ID }}
          CDEK_CLIENT_SECRET: ${{ secrets.AMO_PASSWORD }}
          VPS_DOMAIN: ${{ secrets.VPS_DOMAIN }}
          CDEK_ORDER_NUMBERS: ${{ secrets.CDEK_ORDER_NUMBERS }}
          DASHBOARD_USER: ${{ secrets.DASHBOARD_USER }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          set -Eeuo pipefail
          tar --exclude=.git --exclude=data --exclude=.env -czf amo-release.tgz .
          umask 077
          cat > amo.env.new <<EOF
          CDEK_CLIENT_ID="$CDEK_CLIENT_ID"
          CDEK_CLIENT_SECRET="$CDEK_CLIENT_SECRET"
          PORT=3080
          SYNC_INTERVAL_MINUTES=15
          VPS_DOMAIN_FOR_WEBHOOK="$VPS_DOMAIN"
          EOF
          printf '%s' "$CDEK_ORDER_NUMBERS" > amo-order-numbers
          printf '%s' "$DASHBOARD_USER" > amo-dashboard-user
          printf '%s' "$DASHBOARD_PASSWORD" > amo-dashboard-password

      - name: Upload release and server config
        shell: bash
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          export SSHPASS="$VPS_SSH_PASSWORD"
          opts=(-o UserKnownHostsFile="$PWD/known_hosts" -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          sshpass -e scp "${opts[@]}" amo-release.tgz amo.env.new amo-order-numbers amo-dashboard-user amo-dashboard-password ops/provision-server.sh "$VPS_SSH_USER@$VPS_SSH_HOST:/root/"

      - name: Provision and deploy
        shell: bash
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
          VPS_DOMAIN: ${{ secrets.VPS_DOMAIN }}
        run: |
          set -Eeuo pipefail
          export SSHPASS="$VPS_SSH_PASSWORD"
          sshpass -e ssh \
            -o UserKnownHostsFile="$PWD/known_hosts" \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$VPS_SSH_USER@$VPS_SSH_HOST" \
            "chmod 700 /root/provision-server.sh && /root/provision-server.sh '${GITHUB_SHA}' '$VPS_DOMAIN'"
