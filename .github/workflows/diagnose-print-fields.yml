name: Diagnose print fields without exposing order data
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Read field-presence flags only
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
          VERIFY_HOST: ${{ secrets.VPS_SSH_HOST }}
          VERIFY_USER: ${{ secrets.VPS_SSH_USER }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          DIAGNOSTIC_LEAD: ${{ secrets.PRINT_DIAGNOSTIC_LEAD }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$DIAGNOSTIC_LEAD" =~ ^[0-9]+$ ]]
          printf '%s\n' "$KNOWN_HOSTS" > known_hosts
          opts=(-o StrictHostKeyChecking=yes -o UserKnownHostsFile=known_hosts -o ConnectTimeout=20)
          sshpass -e scp "${opts[@]}" ops/diagnose-print-fields.mjs "$VERIFY_USER@$VERIFY_HOST:/root/diagnose-print-fields.mjs"
          sshpass -e ssh "${opts[@]}" "$VERIFY_USER@$VERIFY_HOST" "node /root/diagnose-print-fields.mjs '$DIAGNOSTIC_LEAD'"
